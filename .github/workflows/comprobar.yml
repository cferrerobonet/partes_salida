# Calidad en cada push y PR: ruff y la suite completa (unitarios, interfaz sin
# pantalla y el correo en Chromium con Playwright).
name: Comprobar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
          # Bibliotecas que Qt necesita para arrancar sin pantalla.
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 fonts-dejavu-core
          python -m playwright install --with-deps chromium
      - name: ruff
        run: ruff check src tests scripts
      - name: Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
      - name: Capturas del correo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-correo
          path: test-results/
          if-no-files-found: ignore
