# Segunda barrera, por si el gancho local no está activado o se salta:
# en cada push y PR, ningún archivo del repositorio puede llevar datos del
# servidor de correo ni contraseñas (ADR-016).
name: Secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    name: Sin datos del correo ni contraseñas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comprobar el árbol
        run: bash scripts/comprobar_secretos.sh --todo
