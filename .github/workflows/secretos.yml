# Barrera contra secretos y datos personales en GitHub (segunda línea, por si el gancho local
# no está activado o se salta con --no-verify). Misma copia en cada repositorio; la original vive en la
# skill de usuario «barrera-secretos». En cada push y PR:
#   1. el árbol actual con scripts/comprobar_secretos.sh --todo (secretos, infraestructura, datos personales,
#      tipos de archivo prohibidos y gitleaks);
#   2. todo el historial, ramas y etiquetas, con gitleaks (lo que entró alguna vez sigue ahí aunque se borre).
# GitHub no ofrece su escaneo de secretos en los repositorios privados del plan gratuito: esto lo sustituye.
name: Secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    name: Sin secretos ni datos personales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks 8.30.1
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Árbol actual
        run: bash scripts/comprobar_secretos.sh --todo
      - name: Historial completo
        run: bash scripts/comprobar_secretos.sh --historial-gitleaks
