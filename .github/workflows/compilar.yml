# Compila Windows, macOS y la app Android del vigilante en GitHub, sin compilar nada
# en local (decisión de CarlosFB, igual que Guardias de patio). El repositorio es
# público: los ordenadores de GitHub no cuestan nada.
#
#   · Al publicar una etiqueta vX.Y.Z (`docs/OPERACIONES.md`): pruebas, compila las dos
#     y las adjunta al release. La app avisa sola a cada equipo de la versión nueva.
#   · A mano desde la pestaña Actions: compila y deja los instaladores para descargar.
name: Compilar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Adjuntar los instaladores al release de la última etiqueta"
        type: boolean
        default: false
      depurar:
        description: "Compilar con el diagnóstico de arranque de PyInstaller"
        type: boolean
        default: false
      plataforma:
        description: "Qué compilar"
        type: choice
        options: [todas, macos, windows, android]
        default: todas

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 fonts-dejavu-core
          python -m playwright install --with-deps chromium
      - name: Versión coherente con la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "pyproject.toml dice $v y la etiqueta ${GITHUB_REF_NAME}"; exit 1; }
      - name: Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check src tests scripts
          pytest

  windows:
    name: Instalador de Windows
    needs: pruebas
    if: ${{ inputs.plataforma != 'macos' && inputs.plataforma != 'android' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar exe e instalador
        # pwsh lee los .ps1 como UTF-8; el powershell clásico rompería los acentos.
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Leer la versión
        id: version
        shell: bash
        run: echo "numero=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"
      # Que el exe exista no basta: se arranca y tiene que llegar a la ventana.
      - name: Arrancar el exe hasta la ventana principal
        shell: pwsh
        run: ./scripts/prueba_arranque_windows.ps1 -Exe dist/PartesDeSalida/PartesDeSalida.exe
      # Versión portable para el equipo sin permisos de administrador.
      - name: Empaquetar la versión portable
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PartesDeSalida/*" `
            -DestinationPath "Output/PartesDeSalida-${{ steps.version.outputs.numero }}-Windows-Portable.zip" `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@v7
        with:
          name: PartesDeSalida-Windows
          path: |
            Output/*.exe
            Output/*.zip
          if-no-files-found: error

  macos:
    name: DMG de macOS
    needs: pruebas
    if: ${{ inputs.plataforma != 'windows' && inputs.plataforma != 'android' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt pyinstaller
      - name: Compilar app y DMG
        env:
          PARTES_BUILD_DEPURAR: ${{ inputs.depurar && '1' || '' }}
        run: make dmg PY="$(which python)"
      # Que el DMG exista no basta: se arranca la app y tiene que llegar a la ventana.
      - name: Arrancar la app hasta la ventana principal
        run: |
          set +e
          APP="dist/Partes de salida.app/Contents/MacOS/Partes de salida"
          LOGS="$HOME/Library/Application Support/PartesSalida/logs"
          ls -la "dist/Partes de salida.app/Contents/MacOS/"
          # `exec { $ARGV[0] } @ARGV`: con un solo argumento, perl parte la ruta por
          # los espacios («Partes de salida»), no lanza nada y sale con 0.
          PARTES_PRUEBA_DE_ARRANQUE=ventana QT_QPA_PLATFORM=offscreen perl -e 'alarm 120; exec { $ARGV[0] } @ARGV' "$APP"
          echo "Código de salida: $?"
          ls -la "$LOGS" 2>&1
          tail -n 80 "$LOGS"/app_*.log 2>&1
          tail -n 60 "$LOGS"/faulthandler.log 2>&1
          grep -h "PRUEBA DE ARRANQUE: ventana principal a la vista" "$LOGS"/app_*.log
      - uses: actions/upload-artifact@v7
        with:
          name: PartesSalida-macOS
          path: "*.dmg"
          if-no-files-found: error

  android:
    name: APK del vigilante
    needs: pruebas
    if: ${{ inputs.plataforma != 'windows' && inputs.plataforma != 'macos' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Leer la versión
        id: version
        run: echo "numero=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"
      # La clave de firma fija (secretos; copia en el llavero de CarlosFB): sin ella, el móvil no deja actualizar.
      - name: Clave de firma
        env:
          ALMACEN_B64: ${{ secrets.VIGILANTE_ALMACEN_B64 }}
        run: |
          test -n "$ALMACEN_B64" || { echo "Falta el secreto VIGILANTE_ALMACEN_B64"; exit 1; }
          echo "$ALMACEN_B64" | base64 -d > "$RUNNER_TEMP/vigilante.p12"
      - name: Pruebas del verificador (vectores del QR) y APK firmado
        working-directory: android
        env:
          VIGILANTE_ALMACEN: ${{ runner.temp }}/vigilante.p12
          VIGILANTE_CONTRASENA: ${{ secrets.VIGILANTE_CONTRASENA }}
        run: gradle --no-daemon test assembleRelease -PversionName=${{ steps.version.outputs.numero }}
      - name: Nombre del APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/Vigilante-EPLA-${{ steps.version.outputs.numero }}.apk"
          rm -f "$RUNNER_TEMP/vigilante.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: Vigilante-Android
          path: apk/*.apk
          if-no-files-found: error

  publicar:
    name: Adjuntar al release
    needs: [windows, macos, android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: instaladores
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          etiqueta="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then etiqueta=$(git describe --tags --abbrev=0); fi
          archivos=$(find instaladores -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.apk' \))
          # Notas del release: la entrada de la versión en CHANGELOG.md.
          v="${etiqueta#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notas.md || true
          [ -s notas.md ] || echo "Partes de salida $v" > notas.md
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            gh release upload "$etiqueta" $archivos --clobber
          else
            gh release create "$etiqueta" $archivos --title "Partes de salida $v" --notes-file notas.md
          fi
